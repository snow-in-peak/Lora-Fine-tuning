<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乔峰聊天面板</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>乔峰聊天面板</h1>
        <p>本地前端 + 本地后端 + 远程模型服务 43.167.172.63:9000</p>
      </div>
      <div class="actions">
        <input id="sessionId" value="web_user" />
        <button id="clearBtn">清空历史</button>
      </div>
    </div>

    <div id="status" class="status">正在检查本地后端状态...</div>

    <div id="chatBox" class="chat-box"></div>

    <form id="chatForm" class="chat-form">
      <textarea id="messageInput" placeholder="请输入你的问题，比如：行走江湖，最重要的是什么？" rows="3"></textarea>
      <button type="submit">发送</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
